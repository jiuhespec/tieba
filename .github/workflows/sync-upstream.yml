name: 自动同步上游仓库

on:
  schedule:
    # 每天 UTC 2:00 执行，对应北京时间 10:00
    - cron: '0 2 * * *'

  # 允许手动触发
  workflow_dispatch:

# 允许 GitHub Actions 向当前仓库推送代码
permissions:
  contents: write

# 防止多个同步任务同时运行
concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    name: 同步上游仓库更新

    # 仅在 Fork 仓库中运行
    if: github.repository != 'chiupam/tieba'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 配置 Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 获取当前仓库最新状态
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "当前分支: $CURRENT_BRANCH"

          git fetch origin "$CURRENT_BRANCH"
          git reset --hard "origin/$CURRENT_BRANCH"

          echo "✅ 已获取 Fork 仓库最新状态"

      - name: 获取上游仓库
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          git remote add upstream https://github.com/chiupam/tieba.git || true
          git fetch upstream "$CURRENT_BRANCH"

          echo "✅ 已获取 upstream/$CURRENT_BRANCH"

      - name: 同步上游代码
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "开始同步 upstream/$CURRENT_BRANCH"
          echo "以下内容不会从上游同步："
          echo "  .github/workflows/"
          echo "  .github/last_activity.md"

          # 生成 Fork 当前版本与上游版本之间的差异
          # 排除本地 GitHub Actions 和 keep-alive 活动文件
          git diff --binary HEAD "upstream/$CURRENT_BRANCH" -- \
            . \
            ':(exclude).github/workflows/**' \
            ':(exclude).github/last_activity.md' \
            > /tmp/upstream.patch

          # 如果没有需要同步的变化，则直接结束
          if [ ! -s /tmp/upstream.patch ]; then
            echo "✅ 普通代码已经与上游一致，无需同步"
            exit 0
          fi

          # 应用上游变更
          if git apply --index --3way /tmp/upstream.patch; then
            echo "✅ 已应用上游代码更新"
          else
            echo "❌ 上游代码自动同步失败，请检查冲突"
            exit 1
          fi

          echo ""
          echo "本次准备同步的文件："
          git status --short

      - name: 检查工作流是否被修改
        run: |
          # 安全检查：
          # 理论上这里不应该出现 .github/workflows 的变化
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "❌ 检测到 GitHub Actions 工作流被修改"
            echo "为防止再次触发 Workflows 权限错误，停止同步"
            exit 1
          fi

          echo "✅ GitHub Actions 工作流保持不变"

      - name: 提交同步结果
        run: |
          if git diff --cached --quiet; then
            echo "✅ 没有需要提交的更新"
            exit 0
          fi

          git commit -m "同步上游仓库更新"

          echo "✅ 已创建同步提交"

      - name: 推送更新
        run: |
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          # 再次获取远程状态，降低并发修改导致 push 失败的概率
          git fetch origin "$CURRENT_BRANCH"

          if ! git merge-base --is-ancestor "origin/$CURRENT_BRANCH" HEAD; then
            echo "⚠️ 同步期间 Fork 仓库产生了新的提交"
            echo "为避免覆盖这些修改，本次停止推送"
            exit 1
          fi

          if git push origin "$CURRENT_BRANCH"; then
            echo "✅ 已将上游更新同步到 Fork 仓库"
          else
            echo "❌ 推送失败"
            exit 1
          fi

      - name: 同步完成
        run: |
          echo "🎉 仓库同步完成"
          echo ""
          echo "📝 当前最新提交："
          git log -1 --pretty=format:"%h - %an: %s"