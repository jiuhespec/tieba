name: 百度贴吧自动签到

on:
  schedule:
    # 每天 UTC 18:00 运行
    # 对应北京时间次日凌晨 2:00
    - cron: '7 18 * * *'

  # 支持手动触发
  workflow_dispatch:

jobs:
  signin:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Runner 内部使用北京时间
      TZ: Asia/Shanghai

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm ci

      - name: 运行签到脚本
        env:
          # 基础配置
          BDUSS: ${{ secrets.BDUSS }}
          BATCH_SIZE: ${{ secrets.BATCH_SIZE || '5' }}
          BATCH_INTERVAL: ${{ secrets.BATCH_INTERVAL || '1000' }}

          # 重试配置
          MAX_RETRIES: ${{ secrets.MAX_RETRIES || '3' }}
          RETRY_INTERVAL: ${{ secrets.RETRY_INTERVAL || '5000' }}

          # 通知相关环境变量
          ENABLE_NOTIFY: ${{ secrets.ENABLE_NOTIFY || 'false' }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          WECOM_KEY: ${{ secrets.WECOM_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}

        run: node dist/index.js

      - name: 处理结果
        if: always()
        run: |
          echo "当前北京时间: $(date '+%Y/%m/%d %H:%M:%S')"
          echo "工作流执行状态: ${{ job.status }}"
